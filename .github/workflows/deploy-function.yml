# supabase/functions 가 바뀌어 main에 올라오면 이 앱의 서버 함수를 배포한다.
# 공통 파일(_shared)은 쌤허브 포털 저장소에서 가져온다.
# 필요한 비밀 값: SUPABASE_ACCESS_TOKEN, PORTAL_READ_TOKEN(포털 저장소 읽기 전용 토큰). 없으면 건너뜀.
name: deploy-function
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PORTAL_READ_TOKEN: ${{ secrets.PORTAL_READ_TOKEN }}
      PROJECT_REF: tcgjldvplpdymdcsdray
    steps:
      - name: 비밀 값 확인
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PORTAL_READ_TOKEN" ]; then echo "필요한 비밀 값이 없어 배포를 건너뜁니다."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
        with:
          repository: dasrim-max/edu-hub
          token: ${{ secrets.PORTAL_READ_TOKEN }}
          path: _portal
          sparse-checkout: supabase/functions/_shared
      - name: 공통 파일 가져오기
        if: steps.chk.outputs.skip != '1'
        run: cp -r _portal/supabase/functions/_shared supabase/functions/_shared
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.skip != '1'
        with:
          version: latest
      - name: 함수 배포 (코드 안에서 직접 인증하므로 --no-verify-jwt)
        if: steps.chk.outputs.skip != '1'
        run: |
          for fn in $(ls supabase/functions | grep -v '^_shared$'); do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          done
